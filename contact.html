<h1>Contact</h1>
<p>Questions, media enquiries, volunteering or sponsorship: send us a message.</p>
<form action="https://formspree.io/f/myeeezoq" method="POST">
<label for="n">Your name</label><input id="n" name="name" autocomplete="name" required>
<label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email" required>
<label for="m">Message</label><textarea id="m" name="message" rows="5" required></textarea>
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
<p><button class="btn" type="submit">Send message</button></p>
</form>
